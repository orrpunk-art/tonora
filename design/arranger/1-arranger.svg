</style>
</defs>
<rect width="1240" height="760" fill="#1b1d27"/>
<!-- header -->
<rect x="24" y="12" width="32" height="32" rx="8" fill="#262a3a"/><text x="40" y="34" class="t" text-anchor="middle" font-weight="700" font-size="16">T</text>
<text x="66" y="33" class="t" font-weight="700" font-size="18">Tonora</text>
<rect x="166" y="12" width="138" height="30" rx="8" class="btn"/>
<text x="189" y="32" class="s" text-anchor="middle">◎</text><text x="235" y="32" class="s" text-anchor="middle">▦</text>
<rect x="258" y="14" width="44" height="26" rx="6" class="pri"/><text x="280" y="32" fill="#fff" text-anchor="middle">≣</text>
<text x="318" y="54" class="s" font-size="11">Круг · Пиано-ролл · Аранжировщик (⌘1 ⌘2 ⌘3)</text>
<rect x="320" y="12" width="200" height="30" rx="8" class="btn"/><text x="334" y="32" class="t">Мажор · ионийский</text><text x="505" y="32" class="s">⌄</text>
<rect x="532" y="12" width="36" height="30" rx="8" class="btn"/><text x="550" y="32" class="s" text-anchor="middle">♪</text>
<rect x="820" y="12" width="36" height="30" rx="8" class="btn"/><text x="838" y="32" class="s" text-anchor="middle">?</text>
<rect x="862" y="12" width="36" height="30" rx="8" class="btn"/><text x="880" y="32" class="s" text-anchor="middle">⚙</text>

<!-- arranger area -->
<text x="40" y="84" class="t" font-weight="600" font-size="15">Песня · До мажор · 4/4 · 100 BPM · 29 тактов · 1:10</text>
<rect x="760" y="68" width="150" height="26" rx="7" class="btn"/><text x="835" y="86" class="t" text-anchor="middle" font-size="12">Экспорт MIDI песни</text>

<!-- ruler -->
<g class="s" font-size="11">
<line x1="40" y1="118" x2="900" y2="118" stroke="#3a3f55"/>
<text x="40" y="112">1</text><text x="156" y="112">5</text><text x="272" y="112">9</text><text x="301" y="112">10</text><text x="417" y="112">14</text><text x="533" y="112">18</text><text x="649" y="112">22</text><text x="736" y="112">25</text><text x="765" y="112">26</text><text x="852" y="112">29</text>
</g>
<g stroke="#2d3142"><line x1="156" y1="118" x2="156" y2="330"/><line x1="272" y1="118" x2="272" y2="330"/><line x1="301" y1="118" x2="301" y2="330"/><line x1="533" y1="118" x2="533" y2="330"/><line x1="649" y1="118" x2="649" y2="330"/><line x1="765" y1="118" x2="765" y2="330"/></g>

<!-- sections lane: 29 px per bar -->
<g>
<rect x="40" y="128" width="114" height="64" rx="8" class="intro" opacity=".9"/>
<text x="48" y="148" fill="#fff" font-weight="600">Интро</text><text x="48" y="165" fill="#fff" class="mono" font-size="11">C · Am</text><text x="48" y="183" fill="#fff" font-size="11" opacity=".8">4 такта · эмбиент · без бита</text>

<rect x="158" y="128" width="112" height="64" rx="8" class="verse"/>
<text x="166" y="148" fill="#fff" font-weight="600">Куплет 1</text><text x="166" y="165" fill="#fff" class="mono" font-size="11">C Am F G</text><text x="166" y="183" fill="#fff" font-size="11" opacity=".8">4 такта · ×2 · баллада</text>
<text x="262" y="147" fill="#fff" font-size="11" opacity=".8">✎</text>

<rect x="274" y="128" width="25" height="64" rx="6" class="trans"/>
<text x="286" y="166" fill="#fff" font-size="14" text-anchor="middle">⤴</text>

<!-- chorus: selected, hovered -->
<rect x="303" y="128" width="228" height="64" rx="8" class="chorus"/>
<rect x="301" y="126" width="232" height="68" rx="10" fill="none" stroke="#fff" stroke-width="2"/>
<text x="311" y="148" fill="#fff" font-weight="600">Припев 1</text><text x="311" y="165" fill="#fff" class="mono" font-size="11">F G Am C · F G C C</text><text x="311" y="183" fill="#fff" font-size="11" opacity=".9">8 тактов · баллада · проигрыш раз в 2 такта · бит поп</text>
<text x="518" y="147" fill="#fff" font-size="12">✎</text>

<rect x="535" y="128" width="112" height="64" rx="8" class="pit"/>
<text x="543" y="148" fill="#fff" font-weight="600">Яма</text><text x="543" y="165" fill="#fff" class="mono" font-size="11">Am · F</text><text x="543" y="183" fill="#fff" font-size="11" opacity=".8">4 такта · арпеджио · бит тихо</text>

<rect x="651" y="128" width="112" height="64" rx="8" class="verse"/>
<text x="659" y="148" fill="#fff" font-weight="600">Куплет 2</text><text x="659" y="165" fill="#fff" class="mono" font-size="11">C Am F G</text><text x="659" y="183" fill="#fff" font-size="11" opacity=".8">4 такта · ×2 · баллада</text>

<rect x="767" y="128" width="25" height="64" rx="6" class="trans"/><text x="779" y="166" fill="#fff" font-size="14" text-anchor="middle">V7</text>
<rect x="796" y="128" width="86" height="64" rx="8" class="intro" opacity=".9"/>
<text x="804" y="148" fill="#fff" font-weight="600">Концовка</text><text x="804" y="165" fill="#fff" class="mono" font-size="11">G → C</text><text x="804" y="183" fill="#fff" font-size="11" opacity=".8">3 такта</text>
</g>

