<rect x="568" y="204" width="228" height="34" rx="8" class="ghost" stroke="#e09a3c"/><text x="682" y="225" fill="#e09a3c" text-anchor="middle">+ Припев ещё раз · 8 тактов</text>
<text x="303" y="254" class="s">Наведение на секцию: что обычно идёт следом — первым стоит рекомендуемое. Щелчок вставляет, ⌥-щелчок показывает варианты.</text>
</g>

