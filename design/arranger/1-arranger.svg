<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="13">
<defs>
<style>
.t{fill:#e8e9f0}.s{fill:#9a9db3}.mono{font-family:Menlo,monospace}
