<!-- playhead -->
<line x1="372" y1="118" x2="372" y2="330" stroke="#ff7a2f" stroke-width="2"/>
<text x="40" y="358" class="s" font-size="11">Двойной щелчок или ✎ — открыть секцию в пиано-ролле · перетаскивание — переставить · ⌥-перетаскивание — копия · ⌘T — разрезать по такту · край — растянуть</text>

